# Zenkai Native is a source-only repository: a player builds Dragon Ball FighterZ on their own
# Apple silicon Mac, from their own game files and keys, with
#   python3 scripts/build_ipa_from_nsp.py <NSP folder> -k <prod.keys> --platform mac-app
# CI has no game files or keys, so this workflow checks that the mac-app build tooling is present,
# importable and runnable. It does not produce a redistributable app or publish a release.
name: Build check (Zenkai Native mac app)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-mac-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-check:
    name: mac-app build tooling check
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install the Python packages the build script imports
        run: python -m pip install lz4 capstone fonttools
      - name: Check the mac-app build entry point
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_ipa_from_nsp.py dm/mac/pack_app.py
          python3 scripts/build_ipa_from_nsp.py --help
